services:
  - type: web
    name: voice-trigger-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: ALLOWED_ORIGINS
        value: "*"
